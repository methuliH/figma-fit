[project]
name = "figma-fit"
version = "0.1.0"
description = "Figma design context that is guaranteed to fit your token budget."
readme = "PLAN.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[project.scripts]
figma-fit = "figma_fit.server:main"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

calibrate = [
    "anthropic>=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/figma_fit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
